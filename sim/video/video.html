<!doctype html><meta charset="utf-8">
<!-- comma panda demo video in the pyrite docs/video house style. ./make.sh fetches the kit into .kit/, writes
     data.js from the recorded run and renders video.mp4. Open this page in a browser to play it; ?t=12 holds a frame. -->
<link rel="stylesheet" href=".kit/assets/base.css"><link rel="stylesheet" href=".kit/assets/video.css">
<style>
.pd-ev { padding: 14px 18px; } .pd-ev .pd-k { font: 500 17px var(--mono); color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.pd-ev .pd-v { font: 500 26px/1.25 var(--sans); margin-top: 4px; } .pd-ev .pd-s { font: 400 19px/1.35 var(--mono); color: var(--muted); margin-top: 6px; }
.pd-axis { position: absolute; height: 3px; background: var(--sim); }
.pd-tick { position: absolute; width: 1px; height: 14px; background: var(--ink); }
.pd-tl { position: absolute; font: 500 19px var(--mono); color: var(--muted); transform: translateX(-50%); }
.pd-stem { position: absolute; width: 2px; background: var(--ink); }
.pd-dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%); }
.pd-t { color: var(--sim); } .pd-no { color: var(--red); } .pd-ok { color: var(--sim); }
</style>
<body>
<script src="data.js"></script><script src=".kit/assets/video.js"></script>
<script>
const D = window.DATA;   // every value on screen comes from data.js (collect.py, from the recorded run)
const [s0, s1, s2] = D.steers, f = D.bus;
const hex = n => "0x" + n.toString(16).toUpperCase();

// One scene: a timeline of simulated seconds that draws left to right; each event pops in as the line reaches it.
const A = 3, Z = 25, R0 = A + 1, R1 = A + 16;            // the rollout runs over video seconds R0..R1
const SMAX = Math.ceil(s2.t + 0.6), X0 = 40, X1 = 1720, AY = 270;
const X = s => X0 + (X1 - X0) * s / SMAX;
const simAt = t => SMAX * prog(t, R0, R1), at = s => R0 + (R1 - R0) * s / SMAX;   // video t <-> simulated s
// [time, lane, x-anchor, width, color, html]; lanes: above the axis, below it. Anchors keep cards from colliding.
const EV = [
  [s0.t, "up", "c", 340, "var(--red)", `<div class="pd-k">openpilot, <span class="pd-t">${s0.t.toFixed(2)} s</span></div><div class="pd-v">torque ${s0.torque} <span class="pd-no">BLOCKED</span></div><div class="pd-s">cruise off</div>`],
  [D.car_engage, "up", "c", 340, "var(--ink)", `<div class="pd-k">the car's log</div><div class="pd-v">cruise engaged</div><div class="pd-s">at <span class="pd-t">${D.car_engage.toFixed(3)} s</span></div>`],
  [D.panda_engage, "dn", "r", 380, "var(--sim)", `<div class="pd-k">panda health</div><div class="pd-v">controls_allowed <span class="pd-ok">True</span></div><div class="pd-s">read at <span class="pd-t">${D.panda_engage.toFixed(2)} s</span></div>`],
  [f.t, "dn", "l", 700, "var(--sim)", `<div class="pd-k">openpilot, confirmed at <span class="pd-t">${s1.t.toFixed(2)} s</span></div><div class="pd-v">torque ${s1.torque} <span class="pd-ok">sent</span></div>
     <div class="pd-s">on the car's bus at <span class="pd-t">${f.t.toFixed(3)} s</span>: ${hex(f.id)} ${f.data}<br>decoded with comma's Toyota DBC: STEER_TORQUE_CMD = ${f.torque}</div>`],
  [s2.t, "up", "c", 360, "var(--red)", `<div class="pd-k">openpilot, <span class="pd-t">${s2.t.toFixed(2)} s</span></div><div class="pd-v">torque ${s2.torque} <span class="pd-no">BLOCKED</span></div><div class="pd-s">over the limit</div>`],
];
const left = ([s, , anc, w]) => anc == "c" ? X(s) - w / 2 : anc == "r" ? X(s) + 20 - w : X(s) - 20;
const evHtml = EV.map((e, i) => {
  const [s, lane, , w, col, body] = e, up = lane == "up";
  return `<div class="pd-stem" id="tl-st${i}" style="left:${X(s) - 1}px;top:${up ? AY - 50 : AY}px;height:50px"></div>
    <div class="pd-dot" id="tl-d${i}" style="left:${X(s)}px;top:${AY + 1}px;background:${col}"></div>
    <div class="abs card pd-ev" id="tl-e${i}" style="left:${left(e)}px;${up ? `bottom:${680 - AY + 50}px` : `top:${AY + 50}px`};width:${w}px">${body}</div>`;
}).join("");
const ticks = [...Array(SMAX + 1).keys()].map(k => `<div class="pd-tick" id="tl-k${k}" style="left:${X(k)}px;top:${AY - 6}px"></div><div class="pd-tl" id="tl-l${k}" style="left:${X(k)}px;top:${AY + 14}px">${k} s</div>`).join("");
const capSub = (t) => {
  const s = simAt(t);
  return t >= R1 ? `panda's own count: ${D.health.safety_tx_blocked} sends blocked, ${D.health.safety_rx_invalid} invalid frames, ${D.health.faults} faults.`
    : s < D.car_engage - 0.3 ? "With cruise off, panda blocks openpilot's steering."
    : s < f.t ? "The car engages cruise. panda sees it on the bus and allows controls."
    : "A small torque reaches the car. One over the limit does not.";
};

Video({
  title: "comma panda firmware on a simulated STM32H723",
  logo: ".kit/assets/logo-full.svg",
  scenes: [
    { key: "title", from: 0, to: A,
      html: `<div class="center title" style="bottom:-60px"><h1>comma's panda firmware, unmodified,<br>on a simulated STM32H723</h1><p>On a Toyota Prius's CAN bus. openpilot's side is comma's panda library.</p></div>`,
      draw(t, a, e) { appear($("h1", e), t, a + 0.2, 0.6); appear($("p", e), t, a + 0.7, 0.6); } },

    { key: "tl", from: A, to: Z,
      caption: ["Simulated time", "panda keeps openpilot inside the car's safety limits.", capSub],
      html: `<div class="abs label" style="left:0;top:0" id="tl-lab">one run, in simulated seconds</div>
             <div class="pd-axis" id="tl-ax" style="left:${X0}px;top:${AY}px"></div>${ticks}
             ${evHtml}
             <div class="abs card stack pd-ev" id="tl-h" style="left:0;top:${AY + 240}px;width:560px"><div class="pd-k">panda health, end of run</div>
               <div class="pd-v">safety_tx_blocked ${D.health.safety_tx_blocked} &nbsp;·&nbsp; faults ${D.health.faults}</div><div class="pd-s">safety_rx_invalid ${D.health.safety_rx_invalid}</div></div>`,
      draw(t, a) {
        appear($("#tl-lab"), t, a + 0.3);
        const s = simAt(t);
        $("#tl-ax").style.width = (X(s) - X0) + "px";
        for (let k = 0; k <= SMAX; k++) { $("#tl-k" + k).style.opacity = s >= k ? 1 : 0.25; $("#tl-l" + k).style.opacity = s >= k ? 1 : 0.25; }
        EV.forEach(([es], i) => { const p = at(es); appear($("#tl-d" + i), t, p, 0.3, 0); appear($("#tl-st" + i), t, p, 0.3, 0); appear($("#tl-e" + i), t, p + 0.05); });
        appear($("#tl-h"), t, R1 + 0.3);
      } },

    { key: "end", from: Z, to: Z + 4,
      html: `<div class="center end" style="bottom:-100px"><img src=".kit/assets/logo-full.svg"><p>Real firmware. Simulated hardware.</p><div class="u">simantic.com</div></div>`,
      draw(t, a, e) { appear($("img", e), t, a + 0.4, 0.6); appear($("p", e), t, a + 0.9, 0.6); appear($(".u", e), t, a + 1.4, 0.6); } },
  ],
});
</script>
</body>
